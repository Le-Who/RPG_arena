name: Chronicle verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Only correctness, migrations and the production build feed the stable verify check.
# Browser/performance/documentation checks run independently in ui-checks.yml.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHRONICLE_AUTO_MIGRATE: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CHRONICLE_AUTO_MIGRATE: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Separate runners shard files; each runner still executes one PGlite test file at a time.
      - name: Unit and PGlite regressions (${{ matrix.shard }}/4)
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 tests/*.test.ts
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chronicle_ci
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chronicle_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      import-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chronicle_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: chronicle_auth_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U chronicle_test -d chronicle_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CHRONICLE_AUTO_MIGRATE: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chronicle_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Isolated PostgreSQL account claims and ownership fencing
        env:
          CHRONICLE_RUN_AUTH_POSTGRES: "1"
          PGPASSWORD: fixture-only
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test tests/integration/auth-postgres.integration.ts
      - name: Isolated PostgreSQL password and revoked-principal claim races
        env:
          CHRONICLE_RUN_AUTH_RACES_POSTGRES: "1"
          PGPASSWORD: fixture-only
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test tests/integration/auth-races-postgres.integration.ts
      - name: Isolated PostgreSQL quota contention and provider admission
        env:
          CHRONICLE_RUN_QUOTA_POSTGRES: "1"
          PGPASSWORD: fixture-only
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test tests/integration/quota-postgres.integration.ts
      - name: Isolated PostgreSQL import admission and concurrent retries
        env:
          CHRONICLE_RUN_PORTABLE_POSTGRES: "1"
          PGPASSWORD: fixture-only
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test tests/integration/campaign-portable-postgres.integration.ts
      - name: Isolated PostgreSQL turn contention, fencing and rollback
        env:
          CHRONICLE_RUN_TURN_POSTGRES: "1"
          PGPASSWORD: fixture-only
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test tests/integration/turn-postgres.integration.ts
      - name: Isolated PostgreSQL memory, queue, telemetry, image and process recovery
        env:
          CHRONICLE_RUN_MEMORY_POSTGRES: "1"
          CHRONICLE_RUN_QUEUE_POSTGRES: "1"
          CHRONICLE_RUN_PERFORMANCE_POSTGRES: "1"
          CHRONICLE_RUN_VISUAL_POSTGRES: "1"
          CHRONICLE_RUN_TURN_RECOVERY_POSTGRES: "1"
          PGPASSWORD: fixture-only
        run: node --import tsx --import ./tests/helpers/test-environment.ts --test --test-concurrency=1 tests/integration/memory-postgres.integration.ts tests/integration/queue-postgres.integration.ts tests/integration/performance-postgres.integration.ts tests/integration/visual-postgres.integration.ts tests/integration/turn-recovery-postgres.integration.ts
      - name: Fresh schema and replay
        run: |
          npm run migrate
          npm run migrate
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHRONICLE_AUTO_MIGRATE: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/chronicle_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
  verify:
    if: ${{ always() }}
    needs: [static, unit-tests, postgres, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      STATIC_RESULT: ${{ needs.static.result }}
      UNIT_RESULT: ${{ needs.unit-tests.result }}
      POSTGRES_RESULT: ${{ needs.postgres.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Require every core check to succeed
        run: |
          if [[ "$STATIC_RESULT" != success || "$UNIT_RESULT" != success || "$POSTGRES_RESULT" != success || "$BUILD_RESULT" != success ]]; then
            printf 'Core verification failed: static=%s unit=%s postgres=%s build=%s\n' "$STATIC_RESULT" "$UNIT_RESULT" "$POSTGRES_RESULT" "$BUILD_RESULT"
            exit 1
          fi
